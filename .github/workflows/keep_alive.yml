name: Keep Streamlit Alive via Git Commit

on:
  schedule:
    # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # This prevents the app from hitting Streamlit's 12-hour sleep limit
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

permissions:
  contents: write

jobs:
  keep_alive_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Make Empty Commit to Reset Streamlit Timer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive ping $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
